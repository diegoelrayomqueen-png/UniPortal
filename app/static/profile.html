<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi perfil · UniPortal</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="profile">
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
    <a class="brand-mark" href="/dashboard.html"><span class="logo">U</span>UniPortal</a>
    <nav>
      <a class="nav-link" href="/dashboard.html">Panel</a>
      <a class="nav-link active" href="/profile.html" aria-current="page">Mi perfil</a>
      <a class="nav-link" href="/security.html">Seguridad</a>
    </nav>
    <button class="nav-link" type="button" data-logout>Cerrar sesión</button>
  </aside>
  <div class="scrim"></div>
  <div class="main">
    <header class="header">
      <button class="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú">☰ Menú</button>
      <span class="title">Portal de estudiantes</span>
      <div class="user-chip"><span class="who small" id="user-name"><span class="skeleton"></span></span><span class="avatar" id="user-avatar" aria-hidden="true">…</span></div>
    </header>
    <main class="content">
      <h1>Mi perfil</h1>
      <p class="muted">Actualiza tu información personal. El correo no se puede cambiar.</p>
      <section class="card">
        <div id="loading" class="muted">Cargando perfil…</div>
        <div id="alert" class="alert hidden" aria-live="polite"></div>
        <form id="profile-form" class="hidden" novalidate>
          <div class="field" id="f-name"><label for="name">Nombre completo</label><input id="name" type="text" maxlength="120" autocomplete="name" required><div class="field-error" aria-live="polite"></div></div>
          <div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" readonly><div class="hint">Es tu identificador de acceso.</div></div>
          <dl class="kv"><dt>Miembro desde</dt><dd id="since"></dd><dt>Última actualización</dt><dd id="updated"></dd></dl>
          <div class="actions-row"><button id="submit" class="btn btn-primary" type="submit">Guardar cambios</button></div>
        </form>
      </section>
    </main>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
